[package]
name = "modcore"
version = "0.1.0"
edition = "2021"
description = "File logic for Deadlock Mod Studio: gameinfo.gi, VPKs, library and sync"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
crc32fast = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "aac", "isomp4", "vorbis", "ogg", "flac", "adpcm"] }
ebur128 = "0.1"
hound = "3"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
ruzstd = "0.7"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
