name: Build Windows installer

# Every push to main builds the app, signs it, and publishes it as a GitHub
# Release with latest.json. The installed app reads latest.json to update itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing key is set up
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            Write-Host "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from build number
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $p = "src-tauri/tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.version = $v
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8
          $notes = git log -1 --format=%s
          "RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building v$v"

      - name: Install frontend packages
        run: npm ci

      - name: Run core tests on Windows
        working-directory: src-tauri
        run: cargo test -p modcore

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Deadlock Mod Studio v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
