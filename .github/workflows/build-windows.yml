name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the project folder
        shell: pwsh
        run: |
          if (Test-Path "package.json") { $p = "." }
          elseif (Test-Path "deadlock-mod-studio/package.json") { $p = "deadlock-mod-studio" }
          else {
            Write-Host "::error::Project files not found. Upload the contents of the deadlock-mod-studio folder (package.json, src, src-tauri...) to the repo."
            Get-ChildItem -Recurse -Depth 1 | Select-Object FullName
            exit 1
          }
          "PROJ=$p" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Project folder: $p"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.PROJ }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJ }}/src-tauri

      - name: Install frontend packages
        working-directory: ${{ env.PROJ }}
        run: npm ci

      - name: Run core tests on Windows
        working-directory: ${{ env.PROJ }}/src-tauri
        run: cargo test -p modcore

      - name: Build installer
        working-directory: ${{ env.PROJ }}
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Deadlock-Mod-Studio-installer
          path: ${{ env.PROJ }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
